<!DOCTYPE html>
<html>
  <head>
    <meta charset="utf-8" />
    <title>ZoomLogi API</title>
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <!-- Redoc standalone bundle -->
    <script src="https://cdn.redoc.ly/redoc/latest/bundles/redoc.standalone.js"></script>
    <style>
      body {
        margin: 0;
        padding: 0;
        font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      }
      .top-bar {
        display: flex;
        align-items: center;
        justify-content: space-between;
        padding: 0.75rem 1.25rem;
        border-bottom: 1px solid #eee;
        position: sticky;
        top: 0;
        background: #ffffff;
        z-index: 10;
      }
      .top-bar-title {
        font-weight: 600;
      }
      .top-bar-right a {
        margin-left: 1rem;
        text-decoration: none;
        font-size: 0.9rem;
      }
      #redoc-container {
        height: calc(100vh - 50px);
      }
    </style>
  </head>

  <body>
    <div class="top-bar">
      <div class="top-bar-title">ZoomLogi API Docs</div>
      <div class="top-bar-right">
        <!-- Update this link to your actual repo URL -->
        <a href="https://github.com/zoomlogi/docs" target="_blank">
          View on GitHub
        </a>
      </div>
    </div>

    <div id="redoc-container"></div>

    <script>
      Redoc.init(
        // This path must match your OpenAPI file name in the repo
        'openapi.yaml',
        {
          scrollYOffset: 60,
          hideDownloadButton: false,
          expandResponses: '200,201',
          pathInMiddlePanel: true,
          theme: {
            colors: {
              primary: { main: '#2563eb' } // optional: ZoomLogi-ish blue
            },
            sidebar: {
              backgroundColor: '#f9fafb'
            }
          }
        },
        document.getElementById('redoc-container')
      );
    </script>
  </body>
</html>
